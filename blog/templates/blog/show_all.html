{% extends 'blog/base.html' %}

{% block content %}

<h1> Showing all Articles: </h1>

<!-- Displays the QuerySet of all Articles: -->
<!--{{articles}} -->

<main class="grid-container">
    <!-- Scriplet code for Loop-->
     {% for article in articles %}
     <article>
        <div>
            <h2> {{article.title}}</h2>
            <h3> by {{article.author}}</h3>
            <p>
                {{article.text}}
            </p>
        </div>
        <a href="{% url 'article' article.pk %}"> <!-- Calls the article function-->
        <img src="{{article.image_url}}" alt="John_Lenin">
        </a>
    </article>
     <hr>

     {% endfor %}
</main>
{% endblock %}
